<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>■</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23000%27/%3E%3C/svg%3E" />
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Apple SD Gothic Neo", "맑은 고딕", sans-serif; }
    :root {
      --clock-color: #d9d9d9;
      --clock-scale: 1;
      --timer-scale: 0.7;
      /* 가장자리 여백: 와이드/16:9 어디서든 비슷한 체감이 되도록 vmin 기준 */
      --pad-y: clamp(20px, 5vmin, 90px);
      --pad-x: clamp(24px, 6vmin, 110px);
    }

    /* ===== 3x3 배치 그리드 ===== */
    #grid {
      position: fixed; inset: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: 1fr auto 1fr;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      pointer-events: none;
    }
    .widget {
      display: none;
      user-select: none;
      color: var(--clock-color);
      line-height: 1;
      white-space: nowrap;
    }
    .widget.on { display: block; }
    #time { font-weight: 700; font-variant-numeric: tabular-nums; font-size: calc(clamp(48px, 9vmin, 180px) * var(--clock-scale)); }
    #date { margin-top: 0.35em; opacity: 0.85; font-size: calc(clamp(14px, 2.2vmin, 40px) * var(--clock-scale)); }
    #date.hidden { display: none; }

    /* 위치 (pos-1 ~ pos-9, 좌상단부터 행 순서) */
    .pos-1 { grid-area: 1/1; justify-self: start;  align-self: start;  text-align: left;  }
    .pos-2 { grid-area: 1/2; justify-self: center; align-self: start;  text-align: center;}
    .pos-3 { grid-area: 1/3; justify-self: end;    align-self: start;  text-align: right; }
    .pos-4 { grid-area: 2/1; justify-self: start;  align-self: center; text-align: left;  }
    .pos-5 { grid-area: 2/2; justify-self: center; align-self: center; text-align: center;}
    .pos-6 { grid-area: 2/3; justify-self: end;    align-self: center; text-align: right; }
    .pos-7 { grid-area: 3/1; justify-self: start;  align-self: end;    text-align: left;  }
    .pos-8 { grid-area: 3/2; justify-self: center; align-self: end;    text-align: center;}
    .pos-9 { grid-area: 3/3; justify-self: end;    align-self: end;    text-align: right; }

    /* ===== 타이머 (Time Timer 스타일) ===== */
    #timer { pointer-events: auto; text-align: center; }
    #dial { cursor: grab; touch-action: none; }
    #dial.dragging { cursor: grabbing; }
    #remain { cursor: text; }
    #remain:hover { text-decoration: underline dotted; text-underline-offset: 0.12em; text-decoration-color: color-mix(in srgb, var(--clock-color) 40%, transparent); }
    #editremain {
      display: none; margin-top: 0.3em; width: 4.2em; text-align: center;
      background: transparent; border: 0; border-bottom: 2px solid var(--clock-color); color: var(--clock-color);
      font: inherit; font-weight: 700; font-variant-numeric: tabular-nums; font-size: calc(clamp(32px, 6vmin, 120px) * var(--timer-scale));
      line-height: 1; padding: 0; outline: none;
    }
    #timer.editing #remain { display: none; }
    #timer.editing #editremain { display: inline-block; }
    #dial { width: calc(clamp(160px, 36vmin, 560px) * var(--timer-scale)); height: auto; display: block; margin: 0 auto; }
    #dial .ring { fill: none; stroke: var(--clock-color); stroke-opacity: 0.18; }
    #dial .tick { stroke: var(--clock-color); stroke-opacity: 0.45; stroke-linecap: round; }
    #dial .tick.major { stroke-opacity: 0.8; }
    #dial .sector { fill: var(--clock-color); fill-opacity: 0.85; }
    #dial .hub { fill: #000; stroke: var(--clock-color); stroke-opacity: 0.5; }
    #remain { margin-top: 0.3em; font-weight: 700; font-variant-numeric: tabular-nums; font-size: calc(clamp(32px, 6vmin, 120px) * var(--timer-scale)); }
    #tstate { margin-top: 0.5em; opacity: 0.6; font-size: calc(clamp(12px, 1.8vmin, 32px) * var(--timer-scale)); letter-spacing: 0.08em; min-height: 1em; }
    #timer.running #tstate { opacity: 0.35; }
    #timer.done:not(.editing) #remain { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }

    /* ===== 종료 시 화면 밝아짐 ===== */
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

    /* ===== 설정 패널 (S) ===== */
    #panel {
      position: fixed; right: 16px; bottom: 16px;
      width: 300px; max-width: calc(100vw - 32px);
      max-height: calc(100vh - 32px); overflow-y: auto;
      background: rgba(18,18,18,0.96);
      border: 1px solid #333; border-radius: 10px;
      color: #cfcfcf; font-size: 13px;
      padding: 14px 16px; box-sizing: border-box;
      display: none;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    #panel.on { display: block; }
    #panel h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: #eee; display: flex; justify-content: space-between; }
    #panel h2 span { color: #777; font-weight: 400; font-size: 12px; }
    #panel h3 { margin: 16px 0 4px; padding-top: 12px; border-top: 1px solid #2a2a2a; font-size: 12px; font-weight: 600; color: #aaa; letter-spacing: 0.04em; }
    .row { margin: 12px 0; }
    .row label { display: block; color: #999; margin-bottom: 6px; font-size: 12px; }
    .row label small { color: #666; }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
    .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-sizing: border-box; }
    .swatch.sel { border-color: #fff; }
    .posgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 120px; }
    .posgrid button { height: 30px; }
    .seg { display: flex; gap: 4px; flex-wrap: wrap; }
    .seg button { flex: 1 1 auto; height: 28px; min-width: 44px; padding: 0 8px; white-space: nowrap; }
    #panel button { background: #222; border: 1px solid #333; color: #888; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; }
    #panel button.sel { background: #444; color: #fff; border-color: #666; }
    #panel button:hover { border-color: #555; }
    .inline { display: flex; gap: 6px; align-items: center; }
    .inline input { width: 64px; height: 26px; background: #111; border: 1px solid #333; color: #eee; border-radius: 4px; padding: 0 8px; font-size: 13px; font-family: inherit; }
    .inline input:focus { outline: none; border-color: #666; }
    .keys { margin-top: 12px; padding-top: 10px; border-top: 1px solid #2a2a2a; color: #777; font-size: 11px; line-height: 1.9; }
    kbd { background: #2a2a2a; border: 1px solid #444; border-radius: 3px; padding: 0 5px; color: #ddd; font-family: inherit; }
  </style>
</head>
<body>
  <div id="grid">
    <div id="clock" class="widget" aria-hidden="true">
      <div id="time">00:00:00</div>
      <div id="date">1970-01-01</div>
    </div>
    <div id="timer" class="widget" aria-hidden="true">
      <svg id="dial" viewBox="-110 -110 220 220" aria-hidden="true">
        <circle class="ring" r="100" stroke-width="2"/>
        <g id="ticks"></g>
        <path id="sector" class="sector" d=""/>
        <circle class="hub" r="5" stroke-width="2"/>
      </svg>
      <div id="remain" title="클릭: 시간 입력">30:00</div>
      <input id="editremain" type="text" inputmode="numeric" placeholder="25:00" aria-label="남은 시간 입력" />
      <div id="tstate">SPACE 로 시작</div>
    </div>
  </div>
  <div id="flash"></div>

  <div id="panel" role="dialog" aria-label="설정">
    <h2>설정 <span>S 로 닫기</span></h2>
    <div class="row">
      <label>색상</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="row">
      <label>위치 <small>(숫자키 1-9, 좌상단부터)</small></label>
      <div class="posgrid" id="posgrid"></div>
    </div>
    <div class="row">
      <label>크기</label>
      <div class="seg" id="sizes"></div>
    </div>
    <div class="row">
      <label>시계 날짜</label>
      <div class="seg" id="dateseg"></div>
    </div>

    <h3>타이머</h3>
    <div class="row">
      <label>기본 시간 <small>(분)</small></label>
      <div class="seg" id="durseg"></div>
      <div class="inline" style="margin-top:6px">
        <input id="durinput" type="number" min="1" max="180" step="1" /> <span style="color:#777">분 직접 입력</span>
      </div>
    </div>
    <div class="row">
      <label>종료 알림음</label>
      <div class="seg" id="soundseg"></div>
      <div class="inline" style="margin-top:6px">
        <button id="preview" style="height:26px;padding:0 10px">▶ 미리듣기</button>
        <span style="color:#777">음량</span>
        <input id="vol" type="range" min="0" max="100" step="5" style="width:90px" />
      </div>
    </div>
    <div class="row">
      <label>종료 시 화면 밝아짐 <small>(강도)</small></label>
      <div class="seg" id="flashseg"></div>
    </div>
    <div class="row">
      <label>밝아짐 지속 <small>(초)</small></label>
      <div class="seg" id="flashdurseg"></div>
    </div>
    <div class="row">
      <label>종료 알림 반복 <small>(소리 + 밝아짐)</small></label>
      <div class="seg" id="repeatseg"></div>
    </div>

    <div class="keys">
      <kbd>C</kbd> 시계 &nbsp; <kbd>T</kbd> 타이머 &nbsp; <kbd>S</kbd> 설정 &nbsp; <kbd>F</kbd> 전체화면<br/>
      <kbd>Space</kbd> 시작/정지 &nbsp; <kbd>R</kbd> 리셋 &nbsp; <kbd>↑</kbd><kbd>↓</kbd> ±1분 &nbsp; <kbd>←</kbd><kbd>→</kbd> ±5분<br/>
      다이얼 드래그: 시간 조절 &nbsp;·&nbsp; 다이얼 클릭: 시작/정지 &nbsp;·&nbsp; 숫자 클릭: 직접 입력<br/>
      <kbd>1</kbd>-<kbd>9</kbd> 위치 &nbsp; <kbd>Esc</kbd> 설정 닫기
    </div>
  </div>

  <script>
    // ===== 옵션 =====
    // 검은 배경에서 눈이 편한 색: 순백/고채도는 피하고 채도·명도를 낮춘 톤 위주
    const COLORS = [
      ['#d9d9d9', '소프트 화이트'],
      ['#8a8a8a', '웜 그레이'],
      ['#e0b36a', '앰버'],
      ['#c98a5a', '세피아'],
      ['#8fc98f', '그린'],
      ['#6fc3b5', '민트'],
      ['#7fa9d9', '스카이'],
      ['#a995c9', '라벤더'],
      ['#b35050', '딤 레드'],
    ];
    // 크기 단계: 시계와 타이머의 실제 배율은 다르게 (타이머 다이얼은 같은 배율이면 너무 큼)
    const SIZES = [['s', '작게'], ['m', '보통'], ['l', '크게'], ['xl', '아주 크게']];
    const CLOCK_SCALE = { s: 0.7, m: 1, l: 1.4, xl: 1.9 };
    const TIMER_SCALE = { s: 0.5, m: 0.7, l: 1, xl: 1.4 };
    const POS_ORDER = [1, 2, 3, 4, 5, 6, 7, 8, 9];
    const DURS = [5, 10, 15, 25, 30, 45, 50, 60];
    const SOUNDS = [['bowl', '싱잉볼'], ['wind', '윈드차임'], ['marimba', '마림바'], ['kalimba', '칼림바'], ['bell', '튜블러벨'], ['epiano', '일렉피아노'], ['none', '없음']];
    const FLASHES = [['0', '끔'], ['0.25', '약'], ['0.5', '중'], ['0.85', '강']];
    const FLASH_DURS = [['3', '3'], ['6', '6'], ['10', '10'], ['20', '20']];
    const REPEATS = [['once', '1회'], ['loop', '재설정까지 반복']];

    const DEFAULTS = { color: '#d9d9d9', pos: 5, scale: 'm', date: true,
                       dur: 30, sound: 'bowl', vol: 60, flash: '0.5', flashDur: '6', repeat: 'once' };
    let state = Object.assign({}, DEFAULTS);
    try { Object.assign(state, JSON.parse(localStorage.getItem('bs.settings') || '{}')); } catch (_) {}
    if (!(state.scale in CLOCK_SCALE)) state.scale = { '0.7': 's', '1': 'm', '1.4': 'l' }[state.scale] || 'm'; // 이전 저장값 이전
    if (state.sound === 'chime') state.sound = 'wind';
    if (state.sound === 'wood') state.sound = 'marimba';
    function save() { try { localStorage.setItem('bs.settings', JSON.stringify(state)); } catch (_) {} }

    // ===== DOM =====
    const $ = (id) => document.getElementById(id);
    const clock = $('clock'), elTime = $('time'), elDate = $('date');
    const timer = $('timer'), elRemain = $('remain'), elTState = $('tstate'), elSector = $('sector');
    const panel = $('panel'), flash = $('flash');

    let mode = null; // null | 'clock' | 'timer'

    function selIn(sel, pred) { document.querySelectorAll(sel).forEach(b => b.classList.toggle('sel', pred(b.dataset.v))); }
    function applyState() {
      document.documentElement.style.setProperty('--clock-color', state.color);
      document.documentElement.style.setProperty('--clock-scale', CLOCK_SCALE[state.scale]);
      document.documentElement.style.setProperty('--timer-scale', TIMER_SCALE[state.scale]);
      clock.className = 'widget pos-' + state.pos + (mode === 'clock' ? ' on' : '');
      timer.className = 'widget pos-' + state.pos + (mode === 'timer' ? ' on' : '')
                      + (T.running ? ' running' : '') + (T.done ? ' done' : '');
      clock.setAttribute('aria-hidden', mode !== 'clock');
      timer.setAttribute('aria-hidden', mode !== 'timer');
      elDate.classList.toggle('hidden', !state.date);
      selIn('#swatches .swatch', v => v === state.color);
      selIn('#posgrid button', v => +v === state.pos);
      selIn('#sizes button', v => v === state.scale);
      selIn('#dateseg button', v => (v === '1') === state.date);
      selIn('#durseg button', v => +v === state.dur);
      selIn('#soundseg button', v => v === state.sound);
      selIn('#flashseg button', v => v === state.flash);
      selIn('#flashdurseg button', v => v === state.flashDur);
      selIn('#repeatseg button', v => v === state.repeat);
      if (document.activeElement !== $('durinput')) $('durinput').value = state.dur;
      $('vol').value = state.vol;
      save();
    }

    // ===== 패널 UI 구성 =====
    function buildSeg(id, items, onpick, render) {
      const box = $(id);
      items.forEach(([v, name]) => {
        const b = document.createElement('button');
        b.dataset.v = v; if (render) render(b, v, name); else b.textContent = name;
        b.onclick = () => { onpick(v); applyState(); };
        box.appendChild(b);
      });
    }
    buildSeg('swatches', COLORS, v => state.color = v, (b, v, name) => { b.className = 'swatch'; b.style.background = v; b.title = name; });
    buildSeg('posgrid', POS_ORDER.map(n => [n, String(n)]), v => state.pos = +v);
    buildSeg('sizes', SIZES, v => state.scale = v);
    buildSeg('dateseg', [['1', '표시'], ['0', '숨김']], v => state.date = v === '1');
    buildSeg('durseg', DURS.map(n => [n, String(n)]), v => setDefaultDur(+v));
    buildSeg('soundseg', SOUNDS, v => state.sound = v);
    buildSeg('flashseg', FLASHES, v => state.flash = v);
    buildSeg('flashdurseg', FLASH_DURS, v => state.flashDur = v);
    buildSeg('repeatseg', REPEATS, v => state.repeat = v);
    $('durinput').addEventListener('change', (e) => {
      const n = Math.max(1, Math.min(180, Math.round(+e.target.value || state.dur)));
      setDefaultDur(n); applyState();
    });
    $('vol').addEventListener('input', (e) => { state.vol = +e.target.value; save(); });
    $('preview').addEventListener('click', () => playSound(state.sound));
    panel.addEventListener('keydown', (e) => { if (e.key === 'Escape') { togglePanel(false); e.target.blur(); } e.stopPropagation(); });

    function setDefaultDur(n) {
      state.dur = n;
      if (!T.running && !T.done) { T.remainMs = n * 60000; renderTimer(); }
    }

    // ===== 시계 =====
    function pad(n) { return String(n).padStart(2, '0'); }
    function updateClock() {
      const d = new Date();
      elTime.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      elDate.textContent = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    let clockTimer = null, clockTimeout = null;
    function startClock() {
      stopClock(); updateClock();
      clockTimeout = setTimeout(() => { updateClock(); clockTimer = setInterval(updateClock, 1000); }, 1000 - (Date.now() % 1000));
    }
    function stopClock() { clearInterval(clockTimer); clearTimeout(clockTimeout); }

    // ===== 타이머 =====
    const T = { remainMs: state.dur * 60000, endAt: 0, running: false, done: false, raf: 0, tick: null };

    // 눈금: 60분 다이얼, 5분마다 큰 눈금
    (function buildTicks() {
      const g = $('ticks'); let html = '';
      for (let i = 0; i < 60; i++) {
        const a = (i / 60) * Math.PI * 2, major = i % 5 === 0;
        const r1 = major ? 88 : 94, r2 = 100;
        html += `<line class="tick${major ? ' major' : ''}" x1="${(Math.sin(a) * r1).toFixed(2)}" y1="${(-Math.cos(a) * r1).toFixed(2)}" x2="${(Math.sin(a) * r2).toFixed(2)}" y2="${(-Math.cos(a) * r2).toFixed(2)}" stroke-width="${major ? 2.5 : 1.2}"/>`;
      }
      g.innerHTML = html;
    })();

    function sectorPath(frac) {
      // 12시 방향에서 시계 반대방향으로 frac 만큼 채운 부채꼴 (Time Timer 방식)
      if (frac <= 0) return '';
      if (frac >= 0.9999) return 'M0,-86 A86,86 0 1,1 -0.01,-86 Z';
      const a = frac * Math.PI * 2;
      const x = -Math.sin(a) * 86, y = -Math.cos(a) * 86;
      return `M0,0 L0,-86 A86,86 0 ${a > Math.PI ? 1 : 0},0 ${x.toFixed(2)},${y.toFixed(2)} Z`;
    }
    function renderTimer() {
      const ms = Math.max(0, T.remainMs);
      const total = Math.max(60, state.dur) * 60000; // 60분 다이얼, 그 이상은 전체 길이 기준
      elSector.setAttribute('d', sectorPath(ms / total));
      const s = Math.ceil(ms / 1000);
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      elRemain.textContent = (h ? h + ':' + pad(m) : String(m)) + ':' + pad(sec);
      elTState.textContent = T.done ? '끝 · R 또는 SPACE 로 다시' : T.running ? '' : (ms < state.dur * 60000 ? '일시정지 · SPACE 로 계속' : 'SPACE 로 시작 · 다이얼 드래그로 조절');
    }
    function timerLoop() {
      if (!T.running) return;
      T.remainMs = T.endAt - Date.now();
      if (T.remainMs <= 0) { T.remainMs = 0; T.running = false; T.done = true; renderTimer(); applyState(); onTimerEnd(); return; }
      renderTimer();
      T.raf = requestAnimationFrame(timerLoop);
    }
    function startTimer() {
      stopAlarm();
      if (T.done || T.remainMs <= 0) { T.done = false; T.remainMs = state.dur * 60000; }
      ensureAudio();
      T.endAt = Date.now() + T.remainMs; T.running = true;
      cancelAnimationFrame(T.raf); clearInterval(T.tick);
      T.raf = requestAnimationFrame(timerLoop);
      T.tick = setInterval(timerLoop, 500); // 백그라운드 탭에서도 종료 감지
      applyState(); renderTimer();
    }
    function pauseTimer() {
      T.running = false; T.remainMs = Math.max(0, T.endAt - Date.now());
      cancelAnimationFrame(T.raf); clearInterval(T.tick);
      applyState(); renderTimer();
    }
    function resetTimer() {
      stopAlarm();
      T.running = false; T.done = false; T.remainMs = state.dur * 60000;
      cancelAnimationFrame(T.raf); clearInterval(T.tick);
      applyState(); renderTimer();
    }
    function adjustTimer(deltaMin) {
      stopAlarm();
      if (T.done) { T.done = false; T.remainMs = 0; }
      const cur = T.running ? T.endAt - Date.now() : T.remainMs;
      let next = Math.max(60000, Math.min(180 * 60000, cur + deltaMin * 60000));
      // 분 단위로 정렬 (초 잔여분은 버림)
      next = Math.ceil(next / 60000) * 60000;
      if (T.running) T.endAt = Date.now() + next;
      T.remainMs = next;
      applyState(); renderTimer();
    }
    // 남은 시간을 직접 지정 (실행 중이면 종료 시각도 같이 이동)
    function setRemain(ms) {
      ms = Math.max(1000, Math.min(180 * 60000, ms));
      stopAlarm();
      if (T.done) T.done = false;
      T.remainMs = ms;
      if (T.running) T.endAt = Date.now() + ms;
      applyState(); renderTimer();
    }

    // ===== 다이얼 드래그로 조절 (클릭만 하면 시작/정지) =====
    const dial = $('dial');
    let drag = null;
    function dialMinutesAt(ev) {
      const r = dial.getBoundingClientRect();
      const dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
      let a = Math.atan2(-dx, -dy); if (a < 0) a += Math.PI * 2; // 12시에서 반시계 방향 각도
      const total = Math.max(60, state.dur);
      let m = Math.round(a / (Math.PI * 2) * total);
      if (m === 0 && a > Math.PI) m = total; // 12시 바로 왼쪽은 꽉 찬 상태
      return Math.max(1, Math.min(total, m));
    }
    dial.addEventListener('pointerdown', (ev) => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      drag = { x: ev.clientX, y: ev.clientY, moved: false, wasRunning: T.running };
      dial.setPointerCapture(ev.pointerId);
    });
    dial.addEventListener('pointermove', (ev) => {
      if (!drag) return;
      if (!drag.moved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) < 4) return;
      drag.moved = true; dial.classList.add('dragging');
      setRemain(dialMinutesAt(ev) * 60000);
    });
    function dragEnd(ev) {
      if (!drag) return;
      const wasClick = !drag.moved; drag = null; dial.classList.remove('dragging');
      if (wasClick) { T.running ? pauseTimer() : startTimer(); }
    }
    dial.addEventListener('pointerup', dragEnd);
    dial.addEventListener('pointercancel', dragEnd);

    // ===== 남은 시간 클릭 → 직접 입력 =====
    const editRemain = $('editremain');
    function openEdit() {
      editRemain.value = elRemain.textContent;
      timer.classList.add('editing');
      editRemain.focus(); editRemain.select();
    }
    function closeEdit(apply) {
      if (!timer.classList.contains('editing')) return;
      timer.classList.remove('editing');
      if (!apply) return;
      const ms = parseDuration(editRemain.value);
      if (ms) setRemain(ms);
    }
    // "25" → 25분, "25:30" → 25분30초, "1:00:00" → 1시간
    function parseDuration(str) {
      const parts = str.trim().split(':').map(x => x.trim());
      if (!parts.length || parts.some(x => x === '' || isNaN(+x))) return 0;
      const n = parts.map(Number);
      let sec = 0;
      if (n.length === 1) sec = n[0] * 60;
      else if (n.length === 2) sec = n[0] * 60 + n[1];
      else if (n.length === 3) sec = n[0] * 3600 + n[1] * 60 + n[2];
      else return 0;
      return Math.round(sec) * 1000;
    }
    elRemain.addEventListener('click', openEdit);
    editRemain.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') closeEdit(true);
      else if (e.key === 'Escape') closeEdit(false);
    });
    editRemain.addEventListener('blur', () => closeEdit(true));

    let alarmTimer = null;
    function stopAlarm() {
      clearTimeout(alarmTimer); alarmTimer = null;
      if (flashAnim) { flashAnim.cancel(); flashAnim = null; }
    }
    function fireAlarm() {
      const len = playSound(state.sound); // 소리 길이(초), 없음이면 0
      if (!flashAnim || flashAnim.playState !== 'running') runFlash(); // 밝아짐은 진행 중이면 끊지 않음
      if (state.repeat === 'loop') {
        // 소리가 끝나면 0.6초 뒤 바로 다시. 소리가 없으면 밝아짐 한 사이클 뒤
        const period = len ? (len + 0.6) * 1000 : (+state.flashDur + 1) * 1000;
        alarmTimer = setTimeout(() => { if (T.done) fireAlarm(); }, period);
      }
    }
    function onTimerEnd() {
      stopAlarm();
      fireAlarm();
      if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
        try { new Notification('타이머 종료', { body: state.dur + '분이 지났습니다.', silent: true }); } catch (_) {}
      }
    }

    // ===== 종료 시 밝아짐: 천천히 올라갔다가 머문 뒤 천천히 돌아옴 =====
    let flashAnim = null;
    function runFlash() {
      const peak = +state.flash; if (!peak) return;
      const total = +state.flashDur * 1000;
      if (flashAnim) flashAnim.cancel();
      flashAnim = flash.animate(
        [{ opacity: 0 }, { opacity: peak, offset: 0.4, easing: 'ease-in-out' }, { opacity: peak, offset: 0.6 }, { opacity: 0 }],
        { duration: total, easing: 'ease-in-out', fill: 'forwards' });
    }

    // ===== 알림음 (WebAudio 합성, 외부 파일 없음) =====
    let actx = null;
    function ensureAudio() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
      if (actx && actx.state === 'suspended') actx.resume();
      return actx;
    }
    // 배음 묶음 하나 = 음 하나. partials: [주파수비, 상대음량, 감쇠비(1=전체 길이)]
    // attack: 어택 시간(초). 타악기는 짧게, 보울은 조금 길게
    function tone(ctx, dest, t0, freq, partials, dur, gain, attack = 0.008) {
      partials.forEach(([ratio, amp, decay]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq * ratio;
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(amp * gain, t0 + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * decay);
        o.connect(g).connect(dest); o.start(t0); o.stop(t0 + dur * decay + 0.05);
      });
    }
    // 짧은 노이즈 버스트 = 타격감 (마림바/칼림바의 "톡")
    function click(ctx, dest, t0, dur, gain, cutoff) {
      const n = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
      const g = ctx.createGain(); g.gain.value = gain;
      src.connect(f).connect(g).connect(dest); src.start(t0);
    }
    // 간단한 잔향: 짧은 딜레이 피드백 두 개로 공간감
    function reverb(ctx, dest, amount) {
      const inp = ctx.createGain(), wet = ctx.createGain(); wet.gain.value = amount;
      inp.connect(dest);
      [[0.031, 0.42], [0.047, 0.36]].forEach(([dt, fb]) => {
        const dl = ctx.createDelay(1); dl.delayTime.value = dt;
        const g = ctx.createGain(); g.gain.value = fb;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 3500;
        inp.connect(dl); dl.connect(f).connect(g).connect(dl); dl.connect(wet);
      });
      wet.connect(dest);
      return inp;
    }
    const N = (name) => ({ C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.0, A4: 440.0, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.0, C6: 1046.5, D6: 1174.7, E6: 1318.5, G6: 1568.0 })[name];

    // 각 소리의 실제 울림 길이(초). 반복 간격 계산에 사용
    const SOUND_LEN = { bowl: 3.8, wind: 3.9, marimba: 1.5, kalimba: 2.1, bell: 3.9, epiano: 2.4 };
    function playSound(kind) {
      if (kind === 'none') return 0;
      const ctx = ensureAudio(); if (!ctx) return 0;
      const master = ctx.createGain();
      master.gain.value = Math.pow(state.vol / 100, 1.6) * 0.5; // 음량 커브 (낮은 값에서 더 조용하게)
      const soft = ctx.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 7000; // 귀 아픈 고역 정리
      master.connect(soft).connect(ctx.destination);
      const t = ctx.currentTime + 0.03;

      if (kind === 'bowl') {
        // 싱잉볼: 낮은 기음 + 비조화 배음, 긴 여운, 살짝 어긋난 두 기음이 만드는 느린 울렁임
        const out = reverb(ctx, master, 0.25);
        const p = [[1, 1, 1], [1.004, 0.6, 1], [2.71, 0.35, 0.55], [2.74, 0.2, 0.5], [4.95, 0.12, 0.3], [7.1, 0.05, 0.2]];
        tone(ctx, out, t, 220, p, 8, 0.9, 0.02);
      } else if (kind === 'wind') {
        // 윈드차임: 펜타토닉 높은 음들이 바람에 흩날리듯 불규칙하게, 뒤로 갈수록 드물고 작게
        const out = reverb(ctx, master, 0.4);
        const scale = ['C6', 'D6', 'E6', 'G6', 'A5', 'G5', 'E5'];
        const p = [[1, 1, 1], [2.76, 0.25, 0.5], [5.4, 0.08, 0.3]];
        let tt = 0;
        for (let i = 0; i < 9; i++) {
          const f = N(scale[Math.floor(Math.random() * scale.length)]);
          tone(ctx, out, t + tt, f, p, 2.6, 0.55 * (1 - i / 14), 0.004);
          tt += 0.12 + Math.random() * 0.16 + i * 0.045;
        }
      } else if (kind === 'marimba') {
        // 마림바: 나무의 따뜻한 기음 + 4배 배음(마림바 특유), 짧은 타격 노이즈. 3음 모티프 G4-C5-E5, 마지막은 길게
        const out = reverb(ctx, master, 0.3);
        const p = [[1, 1, 1], [4, 0.28, 0.35], [9.2, 0.06, 0.15]];
        [['G4', 0, 0.9], ['C5', 0.26, 0.9], ['E5', 0.52, 1.6]].forEach(([n, d, len]) => {
          tone(ctx, out, t + d, N(n), p, len, 0.8, 0.004);
          click(ctx, out, t + d, 0.012, 0.25, 2500);
        });
      } else if (kind === 'kalimba') {
        // 칼림바: 금속 혀의 맑은 기음과 높은 비조화 배음, 손톱 튕김. 하행 C6-G5-E5-C5
        const out = reverb(ctx, master, 0.35);
        const p = [[1, 1, 1], [5.4, 0.12, 0.25], [8.9, 0.05, 0.15]];
        [['C6', 0], ['G5', 0.22], ['E5', 0.44], ['C5', 0.66]].forEach(([n, d], i) => {
          tone(ctx, out, t + d, N(n), p, 1.8 + i * 0.3, 0.65, 0.003);
          click(ctx, out, t + d, 0.008, 0.18, 5000);
        });
      } else if (kind === 'bell') {
        // 튜블러벨: 교회 종 느낌의 비조화 배음(짝수배 위에 허밍), 두 번 울림
        const out = reverb(ctx, master, 0.4);
        const p = [[0.5, 0.5, 1], [1, 1, 0.85], [1.183, 0.5, 0.7], [1.506, 0.45, 0.6], [2.0, 0.35, 0.45], [2.514, 0.25, 0.35], [2.662, 0.15, 0.3], [3.011, 0.1, 0.25]];
        tone(ctx, out, t, 440, p, 5, 0.55, 0.006);
        tone(ctx, out, t + 1.4, 440, p, 5, 0.42, 0.006);
      } else if (kind === 'epiano') {
        // 일렉피아노: 부드러운 사인 기음에 약한 2·3배 배음, 낮은 음역 C-E-G 아르페지오 후 화음 지속
        const out = reverb(ctx, master, 0.3);
        const p = [[1, 1, 1], [2, 0.22, 0.5], [3, 0.07, 0.35], [1.002, 0.4, 1]];
        [['C4', 0], ['E4', 0.18], ['G4', 0.36], ['C5', 0.54]].forEach(([n, d]) => tone(ctx, out, t + d, N(n), p, 3.2, 0.45, 0.012));
      }
      return SOUND_LEN[kind] || 2;
    }

    // ===== 모드 전환 =====
    function setMode(m) {
      mode = (mode === m) ? null : m;
      if (mode === 'clock') startClock(); else stopClock();
      applyState();
    }

    // ===== 설정 패널 =====
    function togglePanel(force) {
      const on = force === undefined ? !panel.classList.contains('on') : !!force;
      panel.classList.toggle('on', on);
      if (on && !mode) setMode('clock'); // 설정 중엔 뭔가 보여야 조정이 됨
    }

    // ===== 전체화면 =====
    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {}
    }

    // ===== 키 =====
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const k = e.key.toLowerCase();
      if (k === 'c') { e.preventDefault(); setMode('clock'); }
      else if (k === 't') { e.preventDefault(); setMode('timer'); }
      else if (k === 's') { e.preventDefault(); togglePanel(); }
      else if (k === 'f') { e.preventDefault(); toggleFullscreen(); }
      else if (k === 'escape') { togglePanel(false); }
      else if (/^[1-9]$/.test(k)) { state.pos = +k; applyState(); }
      else if (k === ' ') { e.preventDefault(); if (mode !== 'timer') setMode('timer'); T.running ? pauseTimer() : startTimer(); }
      else if (k === 'r') { e.preventDefault(); resetTimer(); }
      else if (k === 'arrowup') { e.preventDefault(); adjustTimer(1); }
      else if (k === 'arrowdown') { e.preventDefault(); adjustTimer(-1); }
      else if (k === 'arrowright') { e.preventDefault(); adjustTimer(5); }
      else if (k === 'arrowleft') { e.preventDefault(); adjustTimer(-5); }
    });

    // 타이머 시작 시 알림 권한을 조용히 요청해 두면 다른 탭에 있을 때도 알림 가능
    dial.addEventListener('pointerdown', () => { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }, { once: true });

    applyState(); renderTimer();
  </script>
</body>
</html>
